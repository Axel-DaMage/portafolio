version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TS 7 yet — hold majors until
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 lands
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm_and_yarn:
        patterns:
          - "*"
